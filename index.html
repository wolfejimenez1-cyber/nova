<style>
*{box-sizing:border-box}
body{
margin:0;
background:#030914;
color:#e9f8ff;

header{
display:flex;

main{

.orb-area{
text-align:center;
padding:30px 0;

.orb{
width:170px;
height:170px;
margin:10px auto 25px;
border-radius:50%;
display:grid;
place-items:center;
background:
radial-gradient(circle,#b7f8ff 0%,#249fd7 25%,#083a72 65%,#020c19 85%);
box-shadow:0 0 35px #179edd,0 0 85px #075588;

content:"";

50%{box-shadow:0 0 65px #46cfff,0 0 120px #087cc0}

height:260px;
overflow-y:auto;

background:#142c42;

<h1>NOVA</h1>

</header>

<main>

</div>

<div class="layout">

<section class="panel">
<h2>NOVA COMMUNICATION</h2>

<div id="chat"></div>

<form id="form">
<input id="message" placeholder="Ask Nova something..." autocomplete="off">
<div class="actions">
<button type="submit">Send</button>
<button type="button" id="mic">Microphone</button>
<button type="button" id="voice">Voice: OFF</button>
</div>
</form>

<div id="suggestion">
<p id="suggestionText"></p>
<button id="approve">Remember</button>
<button id="reject">Don't remember</button>
</div>
</section>

<section class="panel">
<h2>PERSONAL MEMORY</h2>
<small>Nova asks before saving memories</small>
<div id="memories"></div>

<h2>SYSTEM INFORMATION</h2>
<p>Interface: Online</p>
<p>AI model: Not connected yet</p>
<p>Memory: This browser</p>
<p>Spotify: Not connected yet</p>
<p>Raspberry Pi: Not connected yet</p>
</section>

</div>
</main>

<script>
const $ = id => document.getElementById(id);

let memories = [];
let pending = "";
let voiceOn = false;

try {
memories = JSON.parse(localStorage.getItem("nova_memories") || "[]");
if(!Array.isArray(memories)) memories = [];
} catch {
memories = [];
}

function save(){
try{
localStorage.setItem("nova_memories",JSON.stringify(memories));
return true;
}catch{
reply("Browser storage is unavailable");
return false;
}
}

function clock(){
$("clock").textContent = new Date().toLocaleString();
}
clock();
setInterval(clock,1000);

function add(sender,text){
const div = document.createElement("div");
div.className = "msg " + (sender==="You" ? "you" : "nova");
div.textContent = sender + ": " + text;
$("chat").appendChild(div);
$("chat").scrollTop = $("chat").scrollHeight;
}

function reply(text){
add("Nova",text);
if(voiceOn && "speechSynthesis" in window){
speechSynthesis.cancel();
const speech = new SpeechSynthesisUtterance(text);
speech.rate = 0.95;
speechSynthesis.speak(speech);
}
}

function renderMemories(){
$("memories").replaceChildren();

if(!memories.length){
const p=document.createElement("p");
p.textContent="No approved memories yet";
$("memories").appendChild(p);
return;
}

memories.forEach((item,index)=>{
const div=document.createElement("div");
div.className="memory";

const text=document.createElement("p");
text.textContent=item;

const edit=document.createElement("button");
edit.textContent="Edit";
edit.onclick=()=>{
const changed=prompt("Edit memory",item);
if(changed!==null && changed.trim()){
memories[index]=changed.trim();
save();
renderMemories();
}
};

const del=document.createElement("button");
del.textContent="Delete";
del.onclick=()=>{
if(confirm("Delete this memory?")){
memories.splice(index,1);
save();
renderMemories();
}
};

div.append(text,edit,del);
$("memories").appendChild(div);
});
}

function suggest(text){
if(/password|passcode|secret key|credit card/i.test(text)){
reply("Please don't save passwords or other sensitive secrets");
return;
}
pending=text;
$("suggestionText").textContent="Should I remember: "+text+"?";
$("suggestion").style.display="block";
reply("I found something I could remember. Approve or reject it below.");
}

$("approve").onclick=()=>{
if(pending && !memories.includes(pending)){
memories.push(pending);
if(save()) reply("Memory saved");
}
pending="";
$("suggestion").style.display="none";
renderMemories();
};

$("reject").onclick=()=>{
pending="";
$("suggestion").style.display="none";
reply("Okay I won't remember that");
};

$("form").onsubmit=e=>{
e.preventDefault();

const input=$("message");
const text=input.value.trim();
if(!text)return;

input.value="";
add("You",text);

const lower=text.toLowerCase();

if(lower.startsWith("remember ")){
suggest(text.slice(9));
}
else if(lower.includes("what do you remember")){
reply(memories.length ? memories.join(" | ") : "You haven't approved any memories yet");
}
else if(lower.includes("time") || lower.includes("date")){
reply("It's "+new Date().toLocaleString());
}
else if(lower.startsWith("i like ") || lower.startsWith("i prefer ") || lower.startsWith("my favorite ")){
suggest(text);
}
else{
reply("I'm Nova's website demo. My real AI brain isn't connected yet. I can save approved memories and tell you the time. We'll add conversations when we connect an AI model.");
}
};

$("voice").onclick=()=>{
voiceOn=!voiceOn;
$("voice").textContent=voiceOn?"Voice: ON":"Voice: OFF";
if(!voiceOn && "speechSynthesis" in window){
speechSynthesis.cancel();
}
};

const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;

$("mic").onclick=()=>{
if(!Recognition){
reply("Microphone recognition isn't supported in this browser");
return;
}

const recognition=new Recognition();
recognition.lang="en-US";
recognition.onresult=e=>{
$("message").value=e.results[0][0].transcript;
};
recognition.onerror=()=>{
reply("Microphone input couldn't start");
};
recognition.start();
};

renderMemories();
reply("Hello. I'm Nova. Welcome to your personal assistant.");
  
const backupPanel = document.createElement("div");
backupPanel.className = "panel";
backupPanel.style.marginTop = "16px";

const backupTitle = document.createElement("h2");
backupTitle.textContent = "MEMORY BACKUP";

const backupHelp = document.createElement("p");
backupHelp.textContent =
  "Keep your memory backup in a private place";

const backupText = document.createElement("textarea");
backupText.rows = 5;
backupText.placeholder = "Your backup appears here";
backupText.style.cssText =
  "width:100%;padding:12px;background:#061322;" +
  "color:white;border:1px solid #325c7b;" +
  "border-radius:8px;";

const exportButton = document.createElement("button");
exportButton.textContent = "Show backup text";

exportButton.onclick = () => {
  backupText.value = JSON.stringify(memories, null, 2);
  backupText.focus();
  backupText.select();
  reply("Copy this backup into a private note");
};

const importButton = document.createElement("button");
importButton.textContent = "Restore backup text";

importButton.onclick = () => {
  let restored;

  try {
    restored = JSON.parse(backupText.value);
  } catch {
    reply("That backup text is not valid");
    return;
  }

  if (
    !Array.isArray(restored) ||
    !restored.every(
      x => typeof x === "string" && x.length <= 5000
    )
  ) {
    reply("That is not a valid Nova memory backup");
    return;
  }

  if (!confirm("Add these memories to Nova?")) return;

  const previous = memories.slice();
  memories = [...new Set([...memories, ...restored])];

  if (!save()) {
    memories = previous;
    return;
  }

  renderMemories();
  reply("Memories restored");
};

backupPanel.append(
  backupTitle,
  backupHelp,
  backupText,
  exportButton,
  importButton
);

document.querySelector("main").appendChild(backupPanel);

</script>

<!-- NOVA AI CONNECTION -->
<script src="https://js.puter.com/v2/"></script>

<script>
(() => {
  const oldSend = $("form").onsubmit;
  let busy = false;

  const conversation = [
    {
      role: "system",
      content:
        "You are Nova, a friendly and helpful personal AI " +
        "assistant. Speak naturally and clearly. " +
        "Your user is accessing you through a website. " +
        "Do not claim to control Spotify, Google accounts, " +
        "or devices unless those features are connected."
    }
  ];

  $("form").onsubmit = async function(event) {
    const text = $("message").value.trim();

    if (!text) {
      event.preventDefault();
      return;
    }

    const lower = text.toLowerCase();

    // Keep the existing memory commands
    if (
      lower.startsWith("remember ") ||
      lower.startsWith("i like ") ||
      lower.startsWith("i prefer ") ||
      lower.startsWith("my favorite ") ||
      lower.includes("what do you remember")
    ) {
      return oldSend(event);
    }

    event.preventDefault();

    if (busy) {
      reply("Please wait for my current answer");
      return;
    }

    busy = true;
    $("message").value = "";

    add("You", text);

    try {
      if (!window.puter?.ai?.chat) {
        throw new Error("AI service unavailable");
      }

      const result = await puter.ai.chat(
        [...conversation, {
          role: "user",
          content: text
        }],
        { normalize: true }
      );

      const answer = result?.message?.content;

      if (typeof answer !== "string" || !answer.trim()) {
        throw new Error("No text response");
      }

      reply(answer);

      conversation.push(
        { role: "user", content: text },
        { role: "assistant", content: answer }
      );

      // Keep recent messages for context
      if (conversation.length > 15) {
        conversation.splice(1, conversation.length - 15);
      }

    } catch (error) {
      console.error(error);
      reply(
        "I couldn't connect to the AI service. " +
        "Check your internet connection and Puter sign-in."
      );
    } finally {
      busy = false;
    }
  };

  // Update the system display
  document.querySelectorAll("p").forEach(p => {
    if (p.textContent.trim() === "AI model: Not connected yet") {
      p.textContent = "AI model: Puter AI (sign-in required)";
    }
  });
})();
</script>

<!-- NOVA JARVIS-INSPIRED VOICE -->
<script>
(() => {
  const synth = window.speechSynthesis;

  const panel = document.createElement("div");
  panel.style.marginTop = "15px";

  const title = document.createElement("h2");
  title.textContent = "NOVA VOICE SETTINGS";

  const description = document.createElement("p");
  description.textContent =
    "Choose a calm British voice for Nova";

  const selector = document.createElement("select");
  selector.style.cssText =
    "width:100%;padding:12px;background:#061322;" +
    "color:white;border:1px solid #325c7b;" +
    "border-radius:8px;";

  const test = document.createElement("button");
  test.textContent = "Test Nova's Voice";

  const status = document.createElement("p");
  status.style.color = "#91b5c9";

  panel.append(title, description, selector, test, status);

  document.querySelector(".layout section.panel")
    .appendChild(panel);

  if (!synth) {
    status.textContent = "Speech is not supported here";
    return;
  }

  let availableVoices = [];

  function voiceKey(v) {
    return v.name + "|" + v.lang;
  }

  function loadVoices() {
    availableVoices = synth.getVoices().filter(
      v => v.lang.toLowerCase().startsWith("en")
    );

    selector.replaceChildren();

    if (!availableVoices.length) {
      status.textContent = "No English voices available yet";
      return;
    }

    const saved = localStorage.getItem("nova_voice");

    const preferred =
      availableVoices.find(v => voiceKey(v) === saved) ||
      availableVoices.find(v =>
        v.lang.toLowerCase() === "en-gb" &&
        /ryan|george|daniel|oliver|arthur|brian|male/i
          .test(v.name)
      ) ||
      availableVoices.find(v =>
        v.lang.toLowerCase() === "en-gb"
      ) ||
      availableVoices[0];

    availableVoices.forEach(v => {
      const option = document.createElement("option");
      option.value = voiceKey(v);
      option.textContent = v.name + " (" + v.lang + ")";
      selector.appendChild(option);
    });

    selector.value = voiceKey(preferred);
    status.textContent =
      availableVoices.length + " voices available";
  }

  selector.onchange = () => {
    localStorage.setItem("nova_voice", selector.value);
  };

  function speakNova(text) {
    synth.cancel();

    const speech = new SpeechSynthesisUtterance(text);

    const chosen = availableVoices.find(
      v => voiceKey(v) === selector.value
    );

    if (chosen) {
      speech.voice = chosen;
      speech.lang = chosen.lang;
    }

    speech.rate = 0.9;
    speech.pitch = 0.85;
    speech.volume = 1;

    synth.speak(speech);
  }

  test.onclick = () => {
    speakNova(
      "Good evening. I am Nova. " +
      "Your personal artificial intelligence assistant. " +
      "All systems are operational."
    );
  };

  // Replace the original robotic voice
  reply = function(text) {
    add("Nova", text);
    if (voiceOn) {
      speakNova(text);
    }
  };

  loadVoices();

  if ("addEventListener" in synth) {
    synth.addEventListener("voiceschanged", loadVoices);
  }
})();
</script>

<script>
(() => {
  // Remove the previous robotic voice selector.
  document.querySelectorAll("h2").forEach(h => {
    if (h.textContent.trim() === "NOVA VOICE SETTINGS") {
      h.parentElement.remove();
    }
  });

  const host = document.querySelector(".layout section.panel");
  if (!host) return;

  const panel = document.createElement("div");
  panel.className = "nova-addon";

  panel.innerHTML = `
    <h2>NOVA AI VOICE</h2>
    <p>Choose a natural voice</p>

    <select id="novaAiVoice">
      <option value="fable">British-style - Fable</option>
      <option value="onyx">Deep - Onyx</option>
      <option value="cedar">Calm - Cedar</option>
    </select>

    <button type="button" id="testAiVoice">
      Test AI Voice
    </button>

    <button type="button" id="replayAiVoice">
      Play Last Voice
    </button>

    <p id="aiVoiceStatus">Ready to test</p>

    <h2>SPOTIFY MUSIC</h2>
    <input id="novaSong" placeholder="Song or artist">

    <button type="button" id="searchSpotify">
      Find on Spotify
    </button>

    <p>Spotify search is ready.
    Direct playback controls are coming later.</p>
  `;

  host.appendChild(panel);

  const select = document.getElementById("novaAiVoice");
  const status = document.getElementById("aiVoiceStatus");

  select.value =
    localStorage.getItem("nova_ai_voice") || "fable";

  select.onchange = () => {
    localStorage.setItem("nova_ai_voice", select.value);
  };

  let lastAudio = null;
  let requestNumber = 0;

  async function speakAI(message) {
    // Remove emojis before speaking, but keep them in chat.
    const clean = String(message)
      .replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu, "")
      .replace(/[*_#`]/g, "")
      .replace(/\s+/g, " ")
      .trim()
      .slice(0, 900);

    if (!clean) return;

    const currentRequest = ++requestNumber;

    if (lastAudio) lastAudio.pause();

    if ("speechSynthesis" in window) {
      speechSynthesis.cancel();
    }

    status.textContent = "Preparing AI voice...";

    try {
      if (!window.puter?.ai?.txt2speech) {
        throw new Error("AI voice unavailable");
      }

      const audio = await puter.ai.txt2speech(clean, {
        provider: "openai",
        model: "gpt-4o-mini-tts",
        voice: select.value,
        instructions:
          "Speak calmly and clearly in polished British English. " +
          "Use measured pacing and a warm, confident tone. " +
          "Sound like a sophisticated personal assistant."
      });

      if (currentRequest !== requestNumber) return;

      if (!audio || typeof audio.play !== "function") {
        throw new Error("No audio returned");
      }

      lastAudio = audio;
      status.textContent = "Audio ready";

      try {
        await audio.play();
        status.textContent = "Playing AI voice";
      } catch {
        status.textContent =
          "Press Play Last Voice to hear the audio";
      }

    } catch (error) {
      console.error(error);
      status.textContent =
        "Voice unavailable. Check Puter sign-in or credits.";
    }
  }

  document.getElementById("testAiVoice").onclick = () => {
    speakAI(
      "Good evening. I am Nova, your personal " +
      "artificial intelligence assistant. " +
      "All systems are operational."
    );
  };

  document.getElementById("replayAiVoice").onclick = () => {
    if (lastAudio) {
      lastAudio.currentTime = 0;
      lastAudio.play().catch(() => {
        status.textContent = "Audio could not play";
      });
    }
  };

  // Replace the old robotic voice.
  window.reply = function(message) {
    add("Nova", message);

    if (voiceOn) {
      speakAI(message);
    }
  };

  document.getElementById("searchSpotify").onclick = () => {
    const song = document.getElementById("novaSong")
      .value.trim();

    if (!song) return;

    window.location.assign(
      "https://open.spotify.com/search/" +
      encodeURIComponent(song)
    );
  };
})();
</script>

  };

  get("spClientId").value =
    localStorage.getItem("novaSpotifyClientId") || "";

  let token =
    sessionStorage.getItem("novaSpotifyToken") || "";

  function encode(bytes) {
    return btoa(String.fromCharCode(...bytes))
      .replace(/=/g, "")
      .replace(/\+/g, "-")
      .replace(/\//g, "_");
  }

  async function connect() {
    const clientId = get("spClientId").value.trim();

    if (!/^[a-f0-9]{32}$/i.test(clientId)) {
      throw new Error(
        "Enter your Spotify Client ID first."
      );
    }

    localStorage.setItem(
      "novaSpotifyClientId", clientId
    );

    const verifier = encode(
      crypto.getRandomValues(new Uint8Array(48))
    );

    const state = encode(
      crypto.getRandomValues(new Uint8Array(16))
    );

    const hash = await crypto.subtle.digest(
      "SHA-256",
      new TextEncoder().encode(verifier)
    );

    sessionStorage.setItem("novaSpVerifier", verifier);
    sessionStorage.setItem("novaSpState", state);

    const params = new URLSearchParams({
      client_id: clientId,
      response_type: "code",
      redirect_uri: REDIRECT,
      state: state,
      scope:
        "user-read-playback-state " +
        "user-modify-playback-state",
      code_challenge_method: "S256",
      code_challenge: encode(new Uint8Array(hash))
    });

    location.assign(
      "https://accounts.spotify.com/authorize?" +
      params.toString()
    );
  }

  async function finishLogin() {
    const params = new URLSearchParams(location.search);

    if (!params.has("code") && !params.has("error")) {
      if (token) status("Previously connected. Try Find Devices.");
      return;
    }

    history.replaceState(null, "", REDIRECT);

    if (params.has("error")) {
      throw new Error("Spotify authorization was cancelled.");
    }

    const state = sessionStorage.getItem("novaSpState");
    const verifier =
      sessionStorage.getItem("novaSpVerifier");

    sessionStorage.removeItem("novaSpState");
    sessionStorage.removeItem("novaSpVerifier");

    if (!state || !verifier ||
        state !== params.get("state")) {
      throw new Error(
        "Sign-in expired. Press Connect Spotify again."
      );
    }

    const result = await fetch(
      "https://accounts.spotify.com/api/token",
      {
        method: "POST",
        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded"
        },
        body: new URLSearchParams({
          grant_type: "authorization_code",
          code: params.get("code"),
          redirect_uri: REDIRECT,
          code_verifier: verifier,
          client_id: localStorage.getItem(
            "novaSpotifyClientId"
          )
        })
      }
    );

    const data = await result.json();

    if (!result.ok || !data.access_token) {
      throw new Error("Spotify connection failed.");
    }

    token = data.access_token;

    sessionStorage.setItem("novaSpotifyToken", token);
    sessionStorage.setItem(
      "novaSpotifyExpires",
      String(Date.now() + data.expires_in * 1000)
    );

    status("Spotify connected! Click Find Spotify Devices.");
  }

  async function spotify(path, method = "GET", body) {
    if (!token ||
        Date.now() >= Number(
          sessionStorage.getItem("novaSpotifyExpires")
        )) {
      throw new Error(
        "Your session expired. Connect Spotify again."
      );
    }

    const response = await fetch(
      "https://api.spotify.com/v1" + path,
      {
        method,
        headers: {
          Authorization: "Bearer " + token,
          "Content-Type": "application/json"
        },
        ...(body ? {body: JSON.stringify(body)} : {})
      }
    );

    if (!response.ok) {
      if (response.status === 403) {
        throw new Error(
          "Spotify denied this action. Check Premium, " +
          "app permissions and device support."
        );
      }

      if (response.status === 404) {
        throw new Error(
          "No supported playback device found. " +
          "Try starting Spotify on Xbox first."
        );
      }

      throw new Error(
        "Spotify error " + response.status
      );
    }

    return response.status === 204
      ? null
      : response.json();
  }

  async function findDevices() {
    const data = await spotify("/me/player/devices");
    const dropdown = get("spDevice");

    dropdown.replaceChildren();

    const devices = (data.devices || []).filter(
      d => d.id && !d.is_restricted
    );

    devices.forEach(device => {
      dropdown.add(
        new Option(device.name, device.id)
      );
    });

    const preferred = devices.find(d =>
      /xbox/i.test(d.name)
    ) || devices.find(d => d.is_active);

    if (preferred) {
      dropdown.value = preferred.id;
    }

    return devices.length
      ? "Choose your device, then try Play Song."
      : "No controllable devices found. Open Spotify on Xbox.";
  }

  function device() {
    const id = get("spDevice").value;

    if (!id) {
      throw new Error("Click Find Spotify Devices first.");
    }

    return "?device_id=" + encodeURIComponent(id);
  }

  async function playSong() {
    const song = get("spSong").value.trim();

    if (!song) {
      throw new Error("Enter a song or artist.");
    }

    const results = await spotify(
      "/search?type=track&limit=1&q=" +
      encodeURIComponent(song)
    );

    const track = results.tracks?.items?.[0];

    if (!track) {
      throw new Error("Song not found.");
    }

    await spotify(
      "/me/player/play" + device(),
      "PUT",
      {uris: [track.uri]}
    );

    return "Playing " + track.name;
  }

  async function run(action) {
    try {
      status("Working...");
      const message = await action();
      if (message) status(message);
    } catch (error) {
      console.error(error);
      status(error.message || "Spotify request failed.");
    }
  }

  get("spConnect").onclick =
    () => run(connect);

  get("spDevices").onclick =
    () => run(findDevices);

  get("spPlay").onclick =
    () => run(playSong);

  get("spPause").onclick = () => run(async () => {
    await spotify(
      "/me/player/pause" + device(), "PUT"
    );
    return "Spotify paused.";
  });

  get("spResume").onclick = () => run(async () => {
    await spotify(
      "/me/player/play" + device(), "PUT"
    );
    return "Spotify resumed.";
  });

  get("spNext").onclick = () => run(async () => {
    await spotify(
      "/me/player/next" + device(), "POST"
    );
    return "Skipped to the next song.";
  });

  finishLogin().catch(error => {
    status(error.message);
  });
})();
</script>
